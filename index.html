<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frase do dia</title>
  <style>
    body {
      font-family: Inter;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #945bff;
            margin: 0;
            src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7SUc.woff2) format('woff2');
    }

    .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(208, 233, 254, 0.1);
    }

    p {
      font-size: 1.2rem;
      color:#fbf3f3;
      min-height: 60px; /* Evita que o layout quebre se a frase for longa */
      
    }

    button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #ff21ec;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e919b1; 
    }
  </style>
</head>

<body>
  <main>
    <h1>Olá, Divo(a) ✨</h1>
    <p id="status">Carregando a resposta do divo...</p>
    <button id="btn">Nova frase</button>
  </main>

  <script>
    // PASSO DO MOVIMENTO 4:
    // Troque o texto abaixo pela URL do SEU Worker (termina em .workers.dev).
    const URL_DO_WORKER = "https://projetoceuzinhoapi.robertajovemtech.workers.dev/";

    async function buscar() {
      const status = document.getElementById("status");
      status.textContent = "Buscando...";
      try {
        const resposta = await fetch(URL_DO_WORKER);
        const dados = await resposta.json();
        status.textContent = dados.mensagem 
      } catch (erro) {
        status.textContent = "Não consegui falar com o Worker. Confira a URL.";
      }
    }

    document.getElementById("btn").addEventListener("click", buscar);
    buscar();
  </script>
</body>

</html>
